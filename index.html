        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #202124;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            padding: 20px 30px;
            border-bottom: 1px solid #ebebeb;
        }

        .logo {
            font-size: 24px;
            font-weight: 400;
            color: #1a73e8;
        }

        .search-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            max-width: 100%;
        }

        .search-container.with-results {
            padding: 20px 20px;
            align-items: flex-start;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .search-box-wrapper {
            width: 100%;
            max-width: 584px;
            position: relative;
        }

        .search-container.with-results .search-box-wrapper {
            max-width: 100%;
        }

        .search-box {
            width: 100%;
            padding: 12px 50px 12px 20px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
            transition: box-shadow 0.2s;
        }

        .search-box:hover,
        .search-box:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,.40);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #9aa0a6;
            font-size: 20px;
            pointer-events: none;
        }

        .search-tips {
            margin-top: 20px;
            font-size: 13px;
            color: #5f6368;
            text-align: center;
        }

        .results-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .result-count {
            font-size: 14px;
            color: #70757a;
            margin-bottom: 20px;
        }

        .result-item {
            background: #fff;
            border: 1px solid #e8eaed;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: box-shadow 0.2s;
        }

        .result-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* Source badge styling */
        .source-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .source-badge.data-dictionary {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .source-badge.acd {
            background: #fff3e0;
            color: #ef6c00;
        }

        .source-badge.pending {
            background: #e3f2fd;
            color: #1565c0;
        }

        .source-badge.supplemental {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .source-badge.reference {
            background: #fce4ec;
            color: #c2185b;
        }

        .result-header {
            display: flex;
            align-items: baseline;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .sequence-number {
            font-size: 13px;
            color: #ffffff;
            font-weight: 500;
            padding: 4px 8px;
            background: #013349;
            border-radius: 4px;
        }

        .element-name {
            font-size: 18px;
            font-weight: 500;
            color: #1a0dab;
            flex: 1;
        }

        .acd-number {
            font-size: 12px;
            color: #ef6c00;
            font-weight: 600;
            padding: 3px 8px;
            background: #fff3e0;
            border-radius: 3px;
            border: 1px solid #ffb74d;
        }

        .selection-badge {
            font-size: 12px;
            color: #7b1fa2;
            font-weight: 600;
            padding: 3px 8px;
            background: #f3e5f5;
            border-radius: 3px;
            border: 1px solid #ce93d8;
        }

        .pdf-badge {
            font-size: 12px;
            color: #c2185b;
            font-weight: 600;
            padding: 3px 8px;
            background: #fce4ec;
            border-radius: 3px;
            border: 1px solid #f48fb1;
        }

        .result-section {
            margin-bottom: 12px;
        }

        .result-section:last-child {
            margin-bottom: 0;
        }

        .section-label {
            font-size: 12px;
            font-weight: 600;
            color: #70757a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .section-content {
            font-size: 14px;
            line-height: 1.6;
            color: #202124;
            white-space: pre-wrap;
        }

        /* PDF download button */
        .pdf-download-button {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 20px;
            background: #c2185b;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .pdf-download-button:hover {
            background: #ad1457;
        }

        /* Q&A specific styling for ACDs */
        .qa-section {
            background: #fffbf0;
            border-left: 3px solid #ef6c00;
            padding: 12px;
            margin-top: 12px;
            border-radius: 4px;
        }

        .question-label {
            font-size: 12px;
            font-weight: 600;
            color: #ef6c00;
            margin-bottom: 6px;
        }

        .answer-label {
            font-size: 12px;
            font-weight: 600;
            color: #2e7d32;
            margin-top: 10px;
            margin-bottom: 6px;
        }

        /* Notes section for Pending Updates */
        .notes-section {
            background: #e3f2fd;
            border-left: 3px solid #1565c0;
            padding: 12px;
            margin-top: 12px;
            border-radius: 4px;
        }

        .notes-label {
            font-size: 12px;
            font-weight: 600;
            color: #1565c0;
            margin-bottom: 6px;
        }

        /* Supplemental Guidance section */
        .supplemental-section {
            background: #f3e5f5;
            border-left: 3px solid #7b1fa2;
            padding: 12px;
            margin-top: 12px;
            border-radius: 4px;
        }

        .supplemental-label {
            font-size: 12px;
            font-weight: 600;
            color: #7b1fa2;
            margin-bottom: 6px;
        }

        .posted-date {
            font-size: 11px;
            color: #70757a;
            font-style: italic;
            margin-top: 8px;
        }

        /* Additional Guidance Styles */
        .additional-guidance-toggle {
            background: #f8f9fa;
            border: 1mm solid #FF6720;
            border-radius: 6px;
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background-color 0.2s;
            margin-top: 12px;
        }

        .additional-guidance-toggle:hover {
            background: #f1f3f4;
        }

        .additional-guidance-toggle-text {
            font-size: 13px;
            font-weight: 600;
            color: #013349;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .additional-guidance-icon {
            font-size: 16px;
            transition: transform 0.3s;
        }

        .additional-guidance-icon.expanded {
            transform: rotate(180deg);
        }

        .additional-guidance-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: #f8f9fa;
            border: 1mm solid #FF6720;
            border-top: none;
            border-radius: 0 0 6px 6px;
            margin-top: -6px;
        }

        .additional-guidance-content.expanded {
            max-height: 2000px;
            transition: max-height 0.5s ease-in;
        }

        .additional-guidance-inner {
            padding: 16px;
            font-size: 14px;
            line-height: 1.6;
            color: #202124;
            white-space: pre-wrap;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #70757a;
        }

        .no-results-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .no-results-text {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .no-results-suggestions {
            font-size: 14px;
            line-height: 1.6;
        }

        mark {
            background-color: #ffeb3b;
            padding: 0 2px;
            border-radius: 2px;
        }

        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
            }

            .logo {
                font-size: 20px;
            }

            .search-container {
                padding: 30px 15px;
            }

            .search-box {
                font-size: 14px;
            }

            .result-item {
                padding: 16px;
            }

            .element-name {
                font-size: 16px;
            }
        }
    </style>
</head>

    "target_value": "The value on arrival at this facility",
    "supporting_definition": "Private Health Insurance: Private health insurance is coverage by a health plan provided through an employer or union or purchased by an individual from a private health insurance company. A health maintenance organization (HMO) is considered private health insurance.\nMedicare: Medicare is the Federal program which helps pay health care costs for people 65 and older and for certain people under 65 with long-term disabilities.\nMedicaid: Medicaid is a program administered at the state level, which provides medical assistance to the needy. Families with dependent children, the aged, blind, and disabled who are in financial need are eligible for Medicaid. It may be known by different names.\nMilitary Health Care: Military Health care - Military health care includes TRICARE/CHAMPUS (Civilian Health and Medical Program of the Uniformed Services) and CHAMPVA (Civilian Health and Medical Program of the Department of Veterans Affairs), as well as care provided by the Department of Veterans Affairs (VA).\nState-Specific Plan (non-Medicaid): State Specific Plans - Some states have their own health insurance programs for low-income uninsured individuals. These health plans may be known by different names in different states.\nIndian Health Service: Indian Health Service (IHS) is a health care program through which the Department of Health and Human Services provides medical assistance to eligible American Indians at IHS facilities. In addition, the IHS helps pay the cost of selected health care services provided at non-IHS facilities.\nNon-US Insurance: Non-US insurance refers to individuals with a payor that does not originate in the United States.",

    "supporting_definition": "Current or previous history of any of the following:\n\n- Ischemic stroke: infarction of central nervous system tissue whether symptomatic or silent (asymptomatic).\n\n-TIA: transient episode of neurological dysfunction caused by focal brain, spinal cord, or retinal ischemia without acute infarction. The symptoms typically last less than 24 hours.\n\n- Noninvasive or invasive arterial imaging test demonstrating 50% stenosis of any of the major extracranial or intracranial vessels to the brain.\n\n- Previous cervical or cerebral artery revascularization surgery or percutaneous intervention.\n\nThis does not include chronic (nonvascular) neurological diseases or other acute neurological insults such as metabolic and anoxic ischemic encephalopathy.",

    "source": "Data Dictionary",
    "sequence": "4561",
    "name": "Canadian Study of Health and Aging (CSHA) Clinical Frailty Scale",
    "coding_instructions": "Indicate the Canadian Study of Health and Aging (CSHA) Clinical Frailty Scale of the patient.",
    "target_value": "The last value prior to the start of the first procedure",
    "supporting_definition": "1 Very Fit: CSHA Clinical Frailty Scale 1: Very Fit - People who are robust, active, energetic and motivated. These people commonly exercise regularly. They are among the fittest for their age\n2 Well: CSHA Clinical Frailty Scale 2: Well - People who have no active disease symptoms but are less fit than category 1. Often, they exercise or are very active occasionally, e.g. seasonally\n3 Managing Well: CSHA Clinical Frailty Scale 3: Managing Well - People whose medical problems are well controlled, but are not regularly active beyond routine walking.\n4 Vulnerable: CSHA Clinical Frailty Scale 4: Vulnerable - While not dependent on others for daily help, often symptoms limit activities. A common complaint is being \"slowed up\", and/or being tired during the day.\n5 Mildly Frail: CSHA Clinical Frailty Scale 5: Mildly Frail - These people often have more evident slowing, and need help in high order IADLs (finances, transportation, heavy housework, medications). Typically, mild frailty progressively impairs shopping and walking outside alone, meal preparation and housework.\n6 Moderately Frail: CSHA Clinical Frailty Scale 6: Moderately Frail - People need help with all outside activities and with keeping house. Inside, they often have problems with stairs and need help with bathing and might need minimal assistance (cuing, standby) with dressing.\n7 Severely Frail: CSHA Clinical Frailty Scale 7: Severely Frail - Completely dependent for personal care, from whatever cause (physical or cognitive). Even so, they seem stable and not at high risk of dying (within ~ 6 months).\n8 Very Severely Frail: CSHA Clinical Frailty Scale 8: Very Severely Frail - Completely dependent, approaching the end of life. Typically, they could not recover even from a minor illness.\n9 Terminally Ill: CSHA Clinical Frailty Scale 9: Terminally Ill - Approaching the end of life. This category applies to people with a life expectancy.",
    "additional_guidance": "",
    "notes": "",

    "supplemental_guidance": "",
    "acd_number": "",

  {
    "source": "Data Dictionary",
    "sequence": "7066",
    "name": "Concomitant Procedures Performed Type",
    "coding_instructions": "Indicate the type of procedure performed in conjunction with a diagnostic coronary angiography and/or PCI procedure.\n\nNote(s):\nThe procedure(s) collected in your application is controlled by Procedure Master file. This file is maintained by the NCDR and will be made available on the internet for downloading and importing/updating into your application.",
    "target_value": "The value on current procedure",
    "supporting_definition": "Biopsy of Heart: A procedure where a small sample of heart muscle is removed for analysis.\nStructural Repair: Correction of a defect or abnormality of the heart that is non-coronary, meaning that it does not affect the blood vessels in the heart, but rather involves the valves, walls, or chambers.\nLeft Atrial Appendage Occlusion: The left atrial appendage (LAA) is a small, ear-shaped sac in the muscle wall of the left atrium. Left Atrial Appendage Occlusion (LAAO) reduces the risk of left atrial appendage blood clots from entering the bloodstream and causing a stroke in patients with non-valvular atrial fibrillation by sealing off the LAA.\nParachute Device Placement: A structural heart medical implantable device commonly used after a myocardial infarction to treat enlargement of the left ventricle (left sided heart failure). The Parachute implant is designed to partition the damaged muscle, isolating the non-functional muscle segment from the functional segment, which decreases the overall volume and restores a more normal geometry and function in the left ventricle.\nMitral Clip Procedure: A transcatheter procedure using a small clip to repair the heart’s mitral valve, typically to treat mitral regurgitation.\nTAVR: A percutaneous intervention for the purpose of implanting a mechanical aortic valve.\nRight Heart Cath: A diagnostic catheterization procedure that includes direct insertion of a catheter into the right atrium.\nEP Study: A cardiac electrophysiology study (EP) is a minimally invasive procedure that tests the electrical conduction system of the heart to assess the electrical activity and conduction pathways of the heart. The study is indicated to investigate the cause, location of origin, and best treatment for various abnormal heart rhythms. This type of study is performed by an electrophysiologist and uses a single or multiple catheters situated within the heart through a vein or artery. If at any step during the EP study the electrophysiologist finds the source of the abnormal electrical activity, he/she may try to ablate the cells that are misfiring. This is done using high-energy radio frequencies (similar to microwaves) to effectively “cook” the abnormal cells.\nTemporary Pacemaker Placement: Temporary pacemaker placement, also called transvenous cardiac pacing or endocardial pacing, is a life-saving procedure to correct symptomatic bradycardia unhelped by medication and transcutaneous pacing. The placement of the pacing electrode, or lead, is advanced through the vein under fluoroscopy to the desired location in the right ventricle.\nPermanent Pacemaker Placement: A permanent pacemaker insertion is the implantation of a small electronic device that is usually placed in the chest, just below the collarbone, to help regulate slow electrical problems with the heart. The pacemaker senses intrinsic heart rhythms and provides electrical stimulation when indicated.\nLIMA (Native Position) Angiogram: Left internal mammary artery (LIMA) angiogram is performed during a cardiac diagnostic catheterization to visualize the blood flow through the artery using a small catheter. The study is undertaken to assess if the LIMA is suitable to use in a coronary artery bypass graft (CABG) procedure.\nAortogram: An aortogram involves placement of a catheter in the aorta and injection of contrast material while taking x-rays of the aorta.\nRenal Angiogram: Angiogram of the renal (kidney) vasculature.\nPeripheral Intervention: Peripheral vascular intervention of any anatomical structure or system in the body except the heart to remove plaque and restore the flow of blood through the artery. These interventions are medical specialties that treat peripheral artery disease without surgically opening the leg or arm. The interventionist uses a catheter that is inserted into a blood vessel through a small cut, usually in the leg or arm, and threaded to the site of disease. Once in place, it acts as a tunnel, enabling the doctor to efficiently guide the tools to where they are needed.\nPeripheral Angiogram: Angiogram of any anatomical structure or system in the body with exception of the heart.\nProcedure Type Not Listed: The procedure performed is not available for selection within the registry.\nCardioversion: The conversion of one cardiac rhythm or electrical pattern to another, almost always from an abnormal to a normal one, by pharmacologic means using medications or by electrical cardioversion using a defibrillator.",

    "notes": "",

    "sequence": "7210",
    "name": "Cumulative Air Kerma",
    "coding_instructions": "Indicate the total radiation dose (Cumulative Air Kerma, or Reference Air Kerma) recorded to the nearest milligray (mGy) or gray (Gy). The value recorded should include the total dose for the lab visit. Cumulative air kerma is the total air kerma accrued from the beginning of an examination or procedure and includes all contributions from fluoroscopic and radiographic irradiation.",
    "target_value": "The total between start of current procedure and end of current procedure",
    "supporting_definition": "Cumulative air kerma (also known as reference, reference dose, cumulative dose, or cumulative dose at a reference point) is the air kerma accumulated at a specific point in space (the patient entrance reference point) relative to the gantry of the fluoroscopy system.\n\nThe quantity, kerma, originated from the acronym, KERMA, for Kinetic Energy Released per unit Mass (of air).",

  {

    "name": "Dose Area Product",
    "coding_instructions": "Indicate the total fluoroscopy dose to the nearest integer. The value recorded should include the total dose for the lab visit.",
    "target_value": "The total between start of current procedure and end of current procedure",
    "supporting_definition": "Dose Area Product is the integral of air kerma (the energy extracted from an x-ray beam per unit mass of air in a small irradiated air volume; for diagnostic x-rays, the dose delivered to that volume of air) across the entire x-ray beam emitted from the x-ray tube. It is a surrogate measure of the amount of energy delivered to the patient.\n\nAlso known as KAP (Kerma Area Product).",

  {
    "source": "Data Dictionary",
    "sequence": "4001",
    "name": "Heart Failure",
    "coding_instructions": "Indicate if the patient has been diagnosed with heart failure.",
    "target_value": "Any occurrence between birth and current procedure",
    "supporting_definition": "Heart failure is a complex clinical syndrome that results from any structural or functional impairment of ventricular filling or ejection of blood. The cardinal manifestations of HF are dyspnea and fatigue, which may limit exercise tolerance, and fluid retention, which may lead to pulmonary and/or splanchnic congestion and/or peripheral edema. Some patients have exercise intolerance but little evidence of fluid retention, whereas others complain primarily of edema, dyspnea, or fatigue. Because some patients present without signs or symptoms of volume overload, the term \"heart failure\" is preferred over \"congestive heart failure.\" There is no single diagnostic test for HF because it is largely a clinical diagnosis based on a careful history and physical examination.",
    "additional_guidance": "",
    "notes": "",
    "selection": "",
    "supplemental_guidance": "",
    "acd_number": "",
    "question": "",
    "answer": "",
    "posted_date": ""

    "sequence": "4011",
    "name": "New York Heart Association Classification",
    "coding_instructions": "Indicate the patient's latest dyspnea or functional class, coded as the New York Heart Association (NYHA) classification.",
    "target_value": "The last value between birth and current procedure",
    "supporting_definition": "The NYHA classes focus on exercise capacity and the symptomatic status of the disease. ",
    "additional_guidance": "Class I: Patients with cardiac disease but without resulting limitations of physical activity. Ordinary physical activity does not cause undue fatigue, palpitation, or dyspnea.\nClass II: Patients with cardiac disease resulting in slight limitation of physical activity. They are comfortable at rest. Ordinary physical activity results in fatigue, palpitation, or dyspnea.\nClass III: Patients with cardiac disease resulting in marked limitation of physical activity. They are comfortable at rest. Less than ordinary activity causes fatigue, palpitation, or dyspnea.\nClass IV: Patients with cardiac disease resulting in inability to carry on any physical activity without discomfort. Symptoms are present even at rest or minimal exertion. If any physical activity is undertaken, discomfort is increased.",

  {
    "source": "Data Dictionary",
    "sequence": "5034",
    "name": "Electrocardiac Abnormality Type",
    "coding_instructions": "Indicate the findings of the electrocardiac assessment.\n\nNote(s): Select all abnormal electrocardiac findings that meet the definition and/or are supported by physician diagnosis.",
    "target_value": "All values between 30 days prior to 1st procedure (or previous procedure) and current procedure",
    "supporting_definition": "Ventricular Fibrillation (VF): Fibrillation is an uncontrolled twitching or quivering of muscle fibers occurring in the lower chambers of the heart (ventricles).\nSustained VT: Ventricular tachycardia (VT) that is > 30 seconds in duration and/or requires termination due to hemodynamic compromise in < 30 seconds.\nNon-Sustained VT: Three or more consecutive beats of VT that self-terminate in < 30 seconds.\nExercise-Induced VT: Ventricular tachycardia induced by exercise.\nT Wave Inversions: T wave inversion is defined as secondary to depolarization abnormalities and is selected as an abnormal electrocardiographic finding when there is specific physician documentation indicating this is an abnormal finding for the patient.\nNew Left Bundle Branch Block: New = Not previously documented.\nNew Onset Atrial Fib: New = Not previously documented.\nNew Onset Atrial Flutter: New = Not previously documented.\nPVC – Frequent: More than 30 premature ventricular contractions (PVCs) per hour.\nPVC – Infrequent: Less than or equal to 30 premature ventricular contractions (PVCs) per hour.\n2nd Degree AV Heart Block Type I: Second-degree atrioventricular block Type 1, also known as Wenckebach (Type I Mobitz), is a disease of the electrical conduction system of the heart (AV node) characterized by progressive prolongation of the PR interval.\n2nd Degree AV Heart Block Type II: Second-degree atrioventricular block Type 2, also known as “Mobitz II,” is usually a disease of the distal conduction system (His-Purkinje System) characterized on a surface ECG by intermittently non-conducted P waves not preceded by PR prolongation and not followed by PR shortening.\n3rd Degree AV Heart Block: Third-degree atrioventricular block (AV block), also known as complete heart block, is when the electrical impulse generated in the sinoatrial node (SA node) in the atrium of the heart does not stimulate the ventricles to contract.\nSymptomatic Bradyarrhythmia: Heart rate under 60 beats per minute that is associated with symptoms of fatigue, weakness, dizziness, sweating and/or syncope.\nST Deviation ≥ 0.5 mm: ST segment deviation greater than or equal to 0.5 mm.\nOther Electrocardiac Abnormality: Electrocardiac abnormality noted but the specific type is not available for selection within the registry.",

    "sequence": "5116",
    "name": "LVEF % (Pre-Procedure)",

    "sequence": "6090",
    "name": "PreProcedure Troponin I ",
    "coding_instructions": "Indicate the Troponin I result in ng/mL.\n \nNote(s): \nThis may include POC (Point of Care) testing results.",
    "target_value": "The last value between date of arrival and current procedure",
    "supporting_definition": "The troponin test is used to help diagnose a heart attack, to detect and evaluate mild to severe heart injury, and to distinguish chest pain that may be due to other causes. Troponin values can remain high for 1-2 weeks after a heart attack. The test is not affected by damage to other muscles, so injections, accidents, and drugs that can damage muscle do not affect troponin levels. Troponin may rise following strenuous exercise, although in the absence of signs and symptoms of heart disease, it is usually of no medical significance.",

    "sequence": "6050",
    "name": "Creatinine",
    "coding_instructions": "Indicate the creatinine (Cr) level mg/dL.\n\nNote(s):\nThis may include POC (Point of Care) testing results or results obtained prior to arrival at this facility.",
    "target_value": "The last value between 30 days prior to the procedure and the current procedure",
    "supporting_definition": "Creatinine or creatine anhydride, is a breakdown product of creatine phosphate in muscle. The loss of water molecule from creatine results in the formation of creatinine. It is transferred to the kidneys by blood plasma, whereupon it is eliminated by glomerular filtration and partial tubular excretion. Creatinine is usually produced at a fairly constant rate and measuring its serum level is a simple test. A rise in blood creatinine levels is observed only with marked damage to functioning nephrons; therefore this test is not suitable for detecting early kidney disease. Creatine and creatinine are metabolized in the kidneys, muscle, liver and pancreas.",

    "sequence": "6030",
    "name": "Hemoglobin",
    "coding_instructions": "Indicate the hemoglobin (Hgb) value in g/dL.\n\nNote(s):  \nThis may include POC (Point of Care) testing results or results obtained prior to arrival at this facility.",
    "target_value": "The last value within 30 days prior to the first procedure in this admission",
    "supporting_definition": "Hemoglobin (Hb or Hgb) is the iron-containing oxygen-transport metalloprotein in the red blood cells. It carries oxygen from the lungs to the rest of the body (i.e. the tissues) where it releases the oxygen to burn nutrients and provide energy. Hemoglobin concentration measurement is among the most commonly performed blood tests, usually as part of a complete blood count. If the concentration is below normal, this is called anemia. Anemias are classified by the size of red blood cells: \"microcytic\" if red cells are small, \"macrocytic\" if they are large, and \"normocytic\" if otherwise. Dehydration or hyperhydration can greatly influence measured hemoglobin levels.",

  {

    "sequence": "8520",
    "name": "Troponin T (Post-Procedure)",
    "coding_instructions": "Indicate the Troponin T result in ng/mL.\n\nNote(s): \nThis may include POC (Point of Care) testing results.",
    "target_value": "The highest value between 6 hours after current procedure and 24 hours after current procedure",
    "supporting_definition": "The troponin test is used to help diagnose a heart attack, to detect and evaluate mild to severe heart injury, and to distinguish chest pain that may be due to other causes. Troponin values can remain high for 1-2 weeks after a heart attack. The test is not affected by damage to other muscles, so injections, accidents, and drugs that can damage muscle do not affect troponin levels. Troponin may rise following strenuous exercise, although in the absence of signs and symptoms of heart disease, it is usually of no medical significance.",

    "sequence": "8510",
    "name": "Creatinine",
    "coding_instructions": "Indicate the post-procedure creatinine level in mg/dL. If more than one level is available, code the peak level.",
    "target_value": "The highest value between current procedure and 5 days after current procedure or until next procedure or discharge",
    "supporting_definition": "Creatinine or creatine anhydride, is a breakdown product of creatine phosphate in muscle. The loss of water molecule from creatine results in the formation of creatinine. It is transferred to the kidneys by blood plasma, whereupon it is eliminated by glomerular filtration and partial tubular excretion. Creatinine is usually produced at a fairly constant rate and measuring its serum level is a simple test. A rise in blood creatinine levels is observed only with marked damage to functioning nephrons; therefore this test is not suitable for detecting early kidney disease. Creatine and creatinine are metabolized in the kidneys, muscle, liver and pancreas.",
    "additional_guidance": "",
    "notes": "",

  {

    "sequence": "8505",
    "name": "Hemoglobin",
    "coding_instructions": "Indicate the hemoglobin (Hgb) value in g/dL.",
    "target_value": "The lowest value between current procedure and 72 hours after current procedure",
    "supporting_definition": "Hemoglobin (Hb or Hgb) is the iron-containing oxygen-transport metalloprotein in the red blood cells. It carries oxygen from the lungs to the rest of the body (i.e. the tissues) where it releases the oxygen to burn nutrients and provide energy. Hemoglobin concentration measurement is among the most commonly performed blood tests, usually as part of a complete blood count. If the concentration is below normal, this is called anemia. Anemias are classified by the size of red blood cells: \"microcytic\" if red cells are small, \"macrocytic\" if they are large, and \"normocytic\" if otherwise. Dehydration or hyperhydration can greatly influence measured hemoglobin levels.",

    "coding_instructions": "Indicate if the PCI procedure was performed in the presence of multi-vessel disease.\n\nNote(s):\nCode 'Yes' if this is the initial (first) PCI procedure for the cath lab indication and the patient has obstructive disease >=70% stenosis in >=2 coronary vessels and/or disease 50%-70% stenosis in >=2 coronary vessels with non-invasive or FFR/IFR evidence of ischemia in that territory and/or left main disease >=50% stenosis.\n(A coronary vessel is defined as: LAD and any of its branches, LCX and any of its branches, RCA and any of its branches, a true RAMUS branch >2 mm)\n\nCode 'Yes' if this is a subsequent, planned staged PCI procedure of a vessel not treated during the initial PCI procedure.  The first PCI could have been during a prior admission, or during this admission but must occur within 90 days of the initial PCI procedure.",

  {
    "source": "Data Dictionary",
    "sequence": "7845",
    "name": "First Device Activation Date and Time",
    "coding_instructions": "Indicate the date and time the first device was activated regardless of type of device used.\n\nNote(s):\nIndicate the time (hours:minutes) using the military 24-hour clock, beginning at midnight (00:00 hours).\n\nUse the earliest time from the following:\n1. Time of the first balloon inflation.\n\n2. Time of the first stent deployment.\n\n3. Time of the first treatment of lesion (AngjoJet or other thrombectomy/aspiration device, laser, rotational atherectomy).\n\n4. If the lesion cannot be crossed with a guidewire or device (and thus none of the above apply), use the time of guidewire introduction.\n\nThis is a process measure about the timeliness of treatment. It is NOT a clinical outcomes measure based on TIMI flow or clinical reperfusion. It does not matter whether the baseline angiogram showed TIMI 3 flow or if the final post-PCI angiogram showed TIMI 0 flow. What is being measured is the time of the first mechanical treatment of the culprit lesion, not the time when TIMI 3 flow was (or was not) restored.",

    "coding_instructions": "Indicate if there was a patient-centered reason for delay in performing the percutaneous coronary intervention (PCI).\n\nNote(s):\nA patient-centered reason for delay is an issue/condition understood and documented to originate  with the patient.  It is not associated with the health care system (i.e. facility, staff or processes, etc.).  \n\nTo warrant coding 'Yes' the patient-centered reason(s) must be identified in the first 90min after arrival at this facility or in the first 90min after an in-house diagnosis of STEMI and be responsible for affecting the time to PCI.  \n\nIf the issue is documented in the medical record and the effect on timing self-evident, it can be coded.  If the effect on timing/delay to PCI is unclear, then there must be specific documentation by a physician/APN/PA that establishes the linkage between the patient issue/condition and the timing/delay in PCI.",

    "name": "Creatinine",
    "coding_instructions": "Indicate the creatinine (Cr) level mg/dL.\n\nA discharge creatinine is coded when there are multiple post‐procedure specimens (to support coding both the post‐procedure & discharge data elements) or when the (single) specimen obtained does not meet the post‐procedure target value.\n\n*Do not code the results from a single specimen in both post‐procedure and discharge data element fields\n",
    "target_value": "The last value on discharge",
    "supporting_definition": "Creatinine or creatine anhydride, is a breakdown product of creatine phosphate in muscle. The loss of water molecule from creatine results in the formation of creatinine. It is transferred to the kidneys by blood plasma, whereupon it is eliminated by glomerular filtration and partial tubular excretion. Creatinine is usually produced at a fairly constant rate and measuring its serum level is a simple test. A rise in blood creatinine levels is observed only with marked damage to functioning nephrons; therefore this test is not suitable for detecting early kidney disease. Creatine and creatinine are metabolized in the kidneys, muscle, liver and pancreas.",

    "supporting_definition": "Hemoglobin (Hb or Hgb) is the iron-containing oxygen-transport metalloprotein in the red blood cells. It carries oxygen from the lungs to the rest of the body (i.e. the tissues) where it releases the oxygen to burn nutrients and provide energy. Hemoglobin concentration measurement is among the most commonly performed blood tests, usually as part of a complete blood count. If the concentration is below normal, this is called anemia. Anemias are classified by the size of red blood cells: \"microcytic\" if red cells are small, \"macrocytic\" if they are large, and \"normocytic\" if otherwise. Dehydration or hyperhydration can greatly influence measured hemoglobin levels.",

    "name": "Comfort Measures Only",
    "coding_instructions": "Indicate if there was physician/nurse practitioner/physician assistant documentation that the patient was receiving comfort measures.\n\nNote(s): \nComfort Measures are not equivalent to the following: Do Not Resuscitate (DNR), living will, no code, no heroic measures.\n\nComfort measures are commonly referred to as palliative care in the medical community and comfort care by the general public. Palliative care includes attention to the psychological and spiritual needs of the patient and support for the dying patient and the patient's family. Usual interventions are not received because a medical decision was made to limit care to comfort measures only.",

    "supporting_definition": "Comfort Measures Only refers to medical treatment of a dying person where the natural dying process is permitted to occur while assuring maximum comfort. It includes attention to the psychological and spiritual needs of the patient and support for both the dying patient and the patient's family. Comfort Measures Only is commonly referred to as \"“comfort care\"” by the general public. It is not equivalent to a physician order to withhold emergency resuscitative measures such as Do Not Resuscitate (DNR).",

    "coding_instructions": "Indicate if there was written documentation of a referral for the patient (by the physician, nurse, or other personnel) to an outpatient cardiac rehabilitation program, or a documented medical or patient-centered reason why such a referral was not made.\n\nThe program may include a traditional cardiac rehabilitation program based on face-to-face interactions and training sessions or may include other options such as home-based approaches.",
    "target_value": "The value on discharge",
    "supporting_definition": "A referral is defined as an official communication between the health care provider and the patient to recommend and carry out a referral order to an early outpatient cardiac rehab (CR) program. This includes the provision of all necessary information to the patient that will allow the patient to enroll in an early outpatient CR program.  This also includes a communication between the health care provider or health care system and the CR program that includes the patient's referral information for the program.  A hospital discharge summary or office note may potentially be formatted to include the necessary patient information to communicate to the CR program [the patient's cardiovascular history, testing, and treatments, for instance].  All communications must maintain appropriate confidentiality as outlined by the 1996 Health Insurance Portability and Accountability Act [HIPPA].",

    "supporting_definition": "Participant ID is a unique number assigned to each database participant by NCDR. A database participant is defined as one entity that signs a Participation Agreement with the NCDR, submits one data submission file to the harvest, and receives one report on their data.\n\nEach participant's data if submitted to harvest must be in one data submission file for a quarter. If one participant keeps their data in more than one file (e.g. at two sites), then the data must be combined into a single data submission to the system to file for the harvest. If two or more participants share a single purchased software, and enter cases into one database, then the data must be exported into different data submission files, one for each participant ID.",

  {
    "source": "Data Dictionary",
    "sequence": "1085",
    "name": "Submission Type",
    "coding_instructions": "Indicate if the data contained in the harvest/data file contains either standard patient episode of care records (arrival date to discharge only) or if it contains patient follow-up records. \n\nA transmission file with all episode of care records (from Arrival to Discharge only) is considered a 'Base Registry Record'.\n\nA file with patient follow-up records (any follow-up assessments performed during the quarter selected) is considered a 'Follow-Up Record'.\n\nNote(s):\nSelecting 'Follow-Up Records Only' will transmit all patient records with Follow-up Assessment Dates (Element Ref# 11000) contained in the selected timeframe, regardless of the procedure or discharge date. For example, if a patient has a procedure on 3/30/2017, is discharged on 3/31/2017, and has a follow-up assessment on 5/6/2017, the patient's episode of care data will be transmitted in the 2017Q1 Base Registry Record file, but the Follow-up data will be transmitted in the 2017Q2 Follow-Up File.",
    "target_value": "",
    "supporting_definition": "",
    "additional_guidance": "",
    "notes": "",

    "acd_number": "",

    "answer": "",
    "posted_date": ""
  },
  {
    "source": "Additional Coding Directive",
    "sequence": "6030",
    "name": "Hemoglobin",
    "coding_instructions": "Indicate the hemoglobin (Hgb) value in g/dL.\n\nNote(s):  \nThis may include POC (Point of Care) testing results or results obtained prior to arrival at this facility.",
    "target_value": "",
    "supporting_definition": "",
    "additional_guidance": "",
    "notes": "",
    "selection": "",
    "supplemental_guidance": "",
    "acd_number": "ACD #25172",
    "question": "Please clarify which lab result is coded when both a Point-of-Care (POC) test and traditional lab are drawn at the same time.  ",
    "answer": "When the lab DRAW time is equal for both POC and Lab run specimens, the registry would have you code the laboratory processed specimen as the pre-procedure lab value.",
    "posted_date": "2020-12-22"
  },
  {
    "source": "Additional Coding Directive",
    "sequence": "6030",
    "name": "Hemoglobin",
    "coding_instructions": "Indicate the hemoglobin (Hgb) value in g/dL.\n\nNote(s):  \nThis may include POC (Point of Care) testing results or results obtained prior to arrival at this facility.",
    "target_value": "",
    "supporting_definition": "",
    "additional_guidance": "",
    "notes": "",
    "selection": "",
    "supplemental_guidance": "",
    "acd_number": "ACD #25173",
    "question": "A patient is diagnosed with STEMI by EMS and is immediately transported to the cath lab for emergent PCI upon arrival.  The procedure start time is 0856 and labs are drawn immediately upon access at 0900.  Please clarify if these labs can be used for 'Pre-Procedure' lab values.",
    "answer": "When the patient condition/emergent presentation results in pre-procedure labs being drawn in the cath lab, it IS acceptable to code these results IF the specimens were obtained immediately upon access and prior to anticoagulation administration. \nAdditional Information:\nBiomarkers obtained in this way would not influence coding for the Seq# 7400 (Indication for Cath Lab Visit) as they were obtained after the patient had arrived in the cath lab and thus would not have influenced decision making.\n",
    "posted_date": "2020-12-22"
  },
  {
    "source": "Additional Coding Directive",
    "sequence": "6991",
    "name": "PreProcedure Medication Administered",
    "coding_instructions": "Indicate if the patient was prescribed or received the medication.\n\nNote(s):\nCode 'No' if a patient was given a sublingual, IV, or short acting formula of one of these medications.\n\nCode 'Yes' if the patient received an oral (long-acting formula) of the medication after admission but prior to this cath lab visit.",
    "target_value": "",
    "supporting_definition": "",
    "additional_guidance": "",
    "notes": "",
    "selection": "",
    "supplemental_guidance": "",
    "acd_number": "ACD #25174",
    "question": "Please clarify the target value of Seq# 6991 (Pre-Procedure Medication Administered) which is “any occurrence between 2 weeks prior to current procedure and current procedure.\"",
    "answer": "Sequence #6991 (Pre-Procedure Medications Administered) captures medications that were prescribed OR administered to the patient within the 2 weeks prior to AND up to the start of current procedure. \nAll medications the patient was prescribed prior to arrival (regardless of the patient’s compliance) as well as medications the patient received at your facility prior to the cath lab procedure should be captured.\nProvider documentation of a medical reason as to why a medication was not prescribed supports coding ‘Contraindicated’ in Seq# 6991.  \nException:\nIn scenarios where a pre-procedure medication is ordered (prescribed) in the hospital BUT is not administered to the patient, please code ‘No’.\n",
    "posted_date": "2020-12-22"
  },
  {
    "source": "Additional Coding Directive",
    "sequence": "4287",
    "name": "Family History of Premature Coronary Artery Disease",
    "coding_instructions": "Indicate if the patient has a family history of premature coronary artery disease.\n\nNote(s):  \nIf the patient is adopted, or the family history is unknown, code 'No'.\n\nFamily history includes any direct blood relatives (parents, siblings, children) who have had any of the following diagnosed at age less than 55 years for male relatives or less than 65 years for female relatives\n\n1. Angina\n\n2. Acute myocardial infarction\n\n3. Sudden cardiac death without obvious cause\n\n4. Coronary artery bypass graft surgery\n\n5. Percutaneous coronary intervention",
    "target_value": "",
    "supporting_definition": "",
    "additional_guidance": "",
    "notes": "",
    "selection": "",
    "supplemental_guidance": "",
    "acd_number": "ACD #24909",
    "question": "Provider documentation indicates there is a  \"family history of premature CAD\".  Is this sufficient to support coding \"Yes\" in Seq#4287 (Family History of Premature Coronary Artery Disease)?",
    "answer": "Yes. The Registry has  clarified that 'Yes' can be coded for Seq#4287 (Family History of Premature Coronary Artery Disease)  when there is documentation of “family history of premature coronary artery disease” or when the supporting definition is met:                                                                                                             \nFamily history includes any direct blood relatives (parents, siblings, children)who have had any of the following diagnosed at age less than 55 years formale relatives or less than 65 years for female relatives\n1. Angina\n2. Acute myocardial infarction\n3. Sudden cardiac death without obvious cause\n4. Coronary artery bypass graft surgery\n5. Percutaneous coronary intervention ",
    "posted_date": "2018-12-18"
  },
  {
    "source": "Additional Coding Directive",
    "sequence": "7400",
    "name": "Indications for Cath Lab Visit",
    "coding_instructions": "Indicate the patient symptoms or condition prompting the cath lab visit.\n\nNote(s): \nThe Cath Lab Indications collected in this field by your application are controlled by Cath Lab Indication Master file. This file is maintained by the NCDR and will be made available on the internet for downloading and importing/updating into your application.",

    "supplemental_guidance": "",
    "acd_number": "ACD #24910",
    "question": "What is used to determine the timeframe <=24 hrs and >24hrs for the “ACS” Cath Lab Indications in Seq#7400?",
    "answer": "The time lapse from ACS diagnosis to cath lab presentation should guide which selection is indicated.  \n\n\n\nTo clarify: Because the definition is focused on when the patient “has” ACS (unstable angina, NSTEMI or STEMI), please use the diagnosis date/time.",
    "posted_date": "2018-12-18"
  },
  {
    "source": "Additional Coding Directive",
    "sequence": "7500",
    "name": "Coronary Circulation Dominance",
    "coding_instructions": "Indicate the dominance of the coronary anatomy (whether the posterior descending artery comes from the right or left vessel system).",

    "acd_number": "ACD #24908",
    "question": "Frequently, coronary dominance is not documented on a subsequent admission for PCI.  When that is the case and the target value \"any occurrence between 30 days prior to the procedure and the procedure\" isn't met, must I leave the data element blank?",
    "answer": "Because 'dominance' does not change, the registry will accept a value for Seq#7500 (Dominance) from information found in a medical record that is  >30 days prior to the procedure.\n\n\n\nEXCEPTION: if the patient has a history of a heart transplant, please ensure dominance is coded to reflect the new heart.",

    "sequence": "7826",
    "name": "Acute Coronary Syndrome Symptom Date",
    "coding_instructions": "Indicate the date and time the patient noted ischemic symptoms lasting greater than or equal to 10 minutes.\n\nNote(s):\nSymptoms may include jaw pain, arm pain, shortness of breath, nausea, vomiting, fatigue/malaise, or other equivalent discomfort suggestive of a myocardial infarction.",

    "coding_instructions": "Indicate the creatinine (Cr) level mg/dL.\n\nA discharge creatinine is coded when there are multiple post‐procedure specimens (to support coding both the post‐procedure & discharge data elements) or when the (single) specimen obtained does not meet the post‐procedure target value.\n\n*Do not code the results from a single specimen in both post‐procedure and discharge data element fields\n",

    "acd_number": "ACD #24862",
    "question": "The patient has multiple creatinine values post-procedure; the HIGHEST value (1.5), drawn 5 days after procedure, is the LAST value drawn.  Therefore, this specimen meets the target value for Seq#8510 (Post-Procedure Creatinine).  Should this SINGLE specimen be captured as BOTH the post-procedure and discharge creatinine in Seq#10060 (Discharge Creatinine)?",
    "answer": "This specimen will only be coded in Seq#8510 (Post-Procedure Creatinine); then 'Not Drawn' is captured in Seq#10661 (Discharge Creatinine Not Drawn).\n\nTo Clarify:  The first note in Seq#10060 specifies that coding a discharge creatinine occurs when there are multiple post-procedure labs; however, the second note clarifies that the results from a single specimen should not be coded in both the post-procedure and discharge data element fields.  This advice is applicable to this scenario.   The discharge creatinine field is intended to capture a unique specimen.",
    "posted_date": "2018-08-22"

    "answer": "Please only select one medication category for each medication.  Then apply the following:\n\n\n• Prescription: Cardiac – medications that are recognized to have a direct cardiac benefit (i.e. statins, beta blockers, diuretics, antihypertensives, antiarrhythmics, anticoagulants, etc.)\n\n\n• Prescriptions:  Non-cardiac – medications that treat non-cardiac diseases (i.e. drugs for diabetes, arthritis, cancer)\n\n\n• Over the Counter (OTC) Medications – whether prescribed or not, if the medication is available ‘over the counter’, select this option (i.e. aspirin, fish oil, antacids)\n\n\n• Vitamins/Minerals – whether prescribed or not, this option includes supplements that are categorized as vitamins or minerals (i.e. folic acid, zinc, etc.)\n\n\n• Herbal Supplements – whether prescribed or not, this option includes supplements that originate from herbs (i.e. cranberry, gingko, echinacea, etc.)",

    "answer": "The coding instructions for the Patient Restriction field are as follows:\n\n\nIndicate if the patient requested for their information not to be used for any research or studies for the associated episode of care.\n\n\nNote(s): Documentation must be found in the patient record to support the request of removal of their information. \n\n\nThe Patient Restriction field was implemented to provide patients with a means to effectively “opt-out” of research or studies.  By checking the box, NCDR participants are indicating the patient has 1) formally requested their NCDR data not be used for any research or studies and 2) this request is substantiated by documentation that can be found in the patient’s medical record.  This box should not be checked if either of these is incomplete or missing.  Patients who meet the definition-based criteria are acknowledging that their NCDR data will not be used for any research or studies for that associated episode of care. Checking the box once does not preclude that patient’s NCDR data from being redacted from research or studies for any previous or future episodes of care.\n\n\nFor purposes of clarity, research or study is defined as any systematic investigation (including research development, testing and evaluation) for the purpose of developing or contributing to generalizable knowledge.",

    "answer": "Seq#10030/10031 (Interventions this Hospitalization/Type) seeks to capture 'percutaneous' and 'surgical' interventions.  The location in which the intervention was performed is a key driver in determining the appropriate selection along with the procedure.  Please review:\n\n*       CABG  = surgical procedure: coronary artery bypass graft surgery (only)\n*       Cardiac Surgery (non-CABG) = surgical procedure: valve repair/replacement; structural repair, etc. (not involving CABG)\n*       Valvular Intervention = non-surgical intervention: transcatheter aortic valve replacement, valvuloplasty\n*       Structural Heart Intervention (non-valvular)  = non-surgical intervention: alcohol septal ablation, PFO repair, PDA closure, (or other involving the heart but not the valve)\n*       Surgery (non-cardiac) = surgical procedure: hip replacement, cholecystectomy, (or other, not in the heart)\n*       EP Study = electrophysiology related procedure (any), ablation, PPM, AICD\n*       Other = peripheral intervention, carotid stent\n",

    "answer": "No.        The Qualitative Quantitative Crosswalk is singularly designed to assist with coding the stenosis observed in the coronary anatomy when descriptive terms are used to describe it in the medical record.  The Data Dictionary does not provide any assistance with converting descriptive terms to a percent stenosis and this document is designed to fill that gap.  The Qualitative Quantitative Crosswalk is not designed for any other purpose and most specifically should not be used to extrapolate the TIMI flow.  The Data Dictionary provides a definition for each TIMI flow selection.  Thus, when descriptive terms are used to describe the TIMI flow in the medical record, the dictionary definition can be used to accurately select the applicable TIMI flow.",

    "answer": "‘Stable Known CAD’ is coded when a patient has known coronary artery disease >= 50% in at least one vessel (from a previous diagnostic cath OR ‘Obstructive CAD’ on Cardiac CTA) and they are stable (meaning they are not experiencing ACS symptoms and are not hemodynamically unstable).  \n\nThis would be inclusive of patients with a history of interventions (CABG, PCI) or newly identified CAD (meeting the definition).  The patient may/may not be experiencing angina; if so, then the angina must be stable (without any change in frequency or pattern for the six weeks prior to this cath lab presentation).",

    "coding_instructions": "Indicate the best estimate of the most severe percent stenosis in the segment of the native coronary vessel identified.\n\nNote(s):\n\nIt is acceptable to use prior cath lab visit information, as long as there have been no changes in coronary anatomy. This includes stenosis determined via cardiac catheterization at another facility. This does not include collaterals.\n\nStenosis represents the percentage diameter reduction, ranging from 0 to 100, associated with the identified vessels. Percent stenosis at its maximal point is estimated to be the amount of reduction in the diameter of the \"normal\" reference vessel proximal to the lesion. In instances where multiple lesions are present, enter the single highest percent stenosis noted",

    "answer": "Please code \"80%\" in Seq#7508, capturing the most severe percent stenosis identified during the procedure, per the coding instructions. The procedure is understood to include the diagnostic and PCI portions and is reflective of all events that transpire during the cath lab visit, meeting the target value of last value between 6 months prior to procedure and current procedure\n\n\nTo clarify:\nWhen capturing stenosis percentage in Section H. Coronary Anatomy and adhering to the target value of \"last value\", it may be necessary to code a different value than what was originally identified during the diagnostic portion of the procedure, such as instances where a stenosis worsens during PCI (i.e. plaque shift).",

    "acd_number": "ACD #24991",
    "question": "Please clarify how the target value for Seq#8510 (Post-Procedure Creatinine) is to be interpreted. ",
    "answer": "The target value for Seq#8510 (Post-Procedure Creatinine) provides guidance on how to code post-procedure creatinine when the patient has multiple specimens (code the highest value) and how to accommodate multiple post-procedure scenarios.  The “or” statements identify what should be applied based on the events that occur. \nTo clarify:\n• Code the highest value between END OF current procedure and 5 days after END OF current procedure. \n• (if a next procedure occurs within 5 days then)\tCode the highest value between END OF current procedure and next procedure. \n• (if the patient is discharged within 5 days then) Code the highest value between END OF current procedure and discharge.\nIf a post-procedure creatinine specimen does not meet one of these parameters, then please code specimen as ‘Not Drawn’ and review Seq#10060 (Discharge Creatinine) to evaluate whether the specimen can be captured there.\nAdditional Clarification:  The registry’s intent in collecting post-procedure lab values (e.g. Troponin, Creatinine, Hemoglobin) is to reflect the patient’s clinical status with lab work drawn after the end of the procedure.   ",

    "answer": "Myocardial Infarction is coded ‘Yes’ for Seq# 9001 (Intra/Post-Procedure Events) whenever there is a NEW obstruction, that results in NEW patient symptoms of ischemia and/or ST elevation that without treatment would result in loss of viable myocardium or new regional wall motion abnormality. \n\n\n\nExample: The cath procedure is in progress and there is a NEW plaque shift, thrombus, dissection, etc. that was not present at the start AND requires immediate intervention (i.e., PCI in progress for mid-LAD lesion and plaque shift occludes the 1st diagonal).\n",

        let searchTimeout = null;

        // PDF file mapping
        const pdfFiles = {
            'Coronary Artery Segment Diagram': 'CathPCI_Coronary_Artery_Diagram.pdf',
            'CSHA Frailty Scale - How to Measure Frailty': 'CathPCI_CSHA_Frailty_Scale.pdf',
            'CathPCI/Chest Pain-MI Registry Qualitative/Quantitative Crosswalk': 'CPMI_-_CathPCI_Crosswalk.pdf'
        };

        // Highlight search terms in text
        function highlightText(text, searchTerm) {
            if (!text || !searchTerm) return text;
            
            const regex = new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }

        // Bold text before colons for better readability
        function formatDefinitionText(text) {
            if (!text) return text;
            
            // Bold any word or phrase followed by a colon (e.g., "Class I:", "Low Intensity Dose:")
            // This regex matches text at the start of a line or after whitespace/newline, followed by a colon
            return text.replace(/(^|\n)([^:\n]+):/gm, '$1<strong>$2:</strong>');
        }

        // Toggle additional guidance
        function toggleGuidance(id) {
            const content = document.getElementById(`guidance-content-${id}`);
            const icon = document.getElementById(`guidance-icon-${id}`);
            
            content.classList.toggle('expanded');
            icon.classList.toggle('expanded');
        }

        // Perform search
        function search(query) {
            if (!query.trim()) {
                document.getElementById('resultsContainer').style.display = 'none';
                document.getElementById('searchContainer').classList.remove('with-results');
                return;
            }

            const searchTerm = query.toLowerCase().trim();
            const results = [];

            // Search through all fields
            cathpciData.forEach(item => {
                const sequenceMatch = item.sequence && item.sequence.toString().toLowerCase().includes(searchTerm);
                const nameMatch = item.name && item.name.toLowerCase().includes(searchTerm);
                const codingMatch = item.coding_instructions && item.coding_instructions.toLowerCase().includes(searchTerm);
                const targetMatch = item.target_value && item.target_value.toLowerCase().includes(searchTerm);
                const supportingMatch = item.supporting_definition && item.supporting_definition.toLowerCase().includes(searchTerm);
                const guidanceMatch = item.additional_guidance && item.additional_guidance.toLowerCase().includes(searchTerm);
                const notesMatch = item.notes && item.notes.toLowerCase().includes(searchTerm);
                const selectionMatch = item.selection && item.selection.toLowerCase().includes(searchTerm);
                const supplementalMatch = item.supplemental_guidance && item.supplemental_guidance.toLowerCase().includes(searchTerm);
                const questionMatch = item.question && item.question.toLowerCase().includes(searchTerm);
                const answerMatch = item.answer && item.answer.toLowerCase().includes(searchTerm);
                const keywordsMatch = item.keywords && item.keywords.toLowerCase().includes(searchTerm);

                if (sequenceMatch || nameMatch || codingMatch || targetMatch || supportingMatch || guidanceMatch || 
                    notesMatch || selectionMatch || supplementalMatch || questionMatch || answerMatch || keywordsMatch) {
                    results.push(item);
                }
            });

            displayResults(results, searchTerm);
        }

        // Display search results
        function displayResults(results, searchTerm) {
            const container = document.getElementById('resultsContainer');
            const searchContainer = document.getElementById('searchContainer');

            if (results.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <div class="no-results-text">No results found for "${searchTerm}"</div>
                        <div class="no-results-suggestions">
                            Try different keywords or check the sequence number
                        </div>
                    </div>
                `;
            } else {
                let html = `<div class="result-count">Found ${results.length} result${results.length > 1 ? 's' : ''}</div>`;
                
                results.forEach((item, index) => {
                    const isACD = item.source === 'Additional Coding Directive';
                    const isPending = item.source === 'Pending Definition Update';
                    const isSupplemental = item.source === 'Supplemental Coding Guidance';
                    const isReference = item.source === 'Reference Resource';
                    
                    let sourceBadgeClass, sourceBadgeText;
                    if (isReference) {
                        sourceBadgeClass = 'reference';
                        sourceBadgeText = 'Reference Resource';
                    } else if (isSupplemental) {
                        sourceBadgeClass = 'supplemental';
                        sourceBadgeText = 'Supplemental Coding Guidance';
                    } else if (isPending) {
                        sourceBadgeClass = 'pending';
                        sourceBadgeText = 'Pending Definition Update';
                    } else if (isACD) {
                        sourceBadgeClass = 'acd';
                        sourceBadgeText = 'Additional Coding Directive';
                    } else {
                        sourceBadgeClass = 'data-dictionary';
                        sourceBadgeText = 'Data Dictionary';
                    }
                    
                    html += `
                        <div class="result-item">
                            <div class="source-badge ${sourceBadgeClass}">${sourceBadgeText}</div>
                            
                            <div class="result-header">
                                ${item.sequence ? `<span class="sequence-number">SEQ# ${highlightText(item.sequence || '', searchTerm)}</span>` : ''}
                                ${item.acd_number ? `<span class="acd-number">${item.acd_number}</span>` : ''}
                                ${item.selection ? `<span class="selection-badge">${highlightText(item.selection, searchTerm)}</span>` : ''}
                                ${item.resource_type ? `<span class="pdf-badge">📄 ${item.resource_type}</span>` : ''}
                                <div class="element-name">${highlightText(item.name || '', searchTerm)}</div>
                            </div>
                            
                            ${item.coding_instructions ? `
                            <div class="result-section">
                                <div class="section-label">${isACD || isPending || isSupplemental || isReference ? 'Description' : 'Coding Instructions'}</div>
                                <div class="section-content">${highlightText(item.coding_instructions, searchTerm)}</div>
                            </div>
                            ` : ''}
                            
                            ${item.target_value ? `
                            <div class="result-section">
                                <div class="section-label">Target Value</div>
                                <div class="section-content">${highlightText(item.target_value, searchTerm)}</div>
                            </div>
                            ` : ''}
                            
                            ${item.supporting_definition ? `
                            <div class="result-section">
                                <div class="section-label">Supporting Definition</div>
                                <div class="section-content">${formatDefinitionText(highlightText(item.supporting_definition, searchTerm))}</div>
                            </div>
                            ` : ''}
                            
                            ${item.notes ? `
                            <div class="notes-section">
                                <div class="notes-label">NOTES</div>
                                <div class="section-content">${highlightText(item.notes, searchTerm)}</div>
                            </div>
                            ` : ''}
                            
                            ${item.supplemental_guidance ? `
                            <div class="supplemental-section">
                                <div class="supplemental-label">SUPPLEMENTAL CODING GUIDANCE</div>
                                <div class="section-content">${formatDefinitionText(highlightText(item.supplemental_guidance, searchTerm))}</div>
                            </div>
                            ` : ''}
                            
                            ${item.question && item.answer ? `
                            <div class="qa-section">
                                <div class="question-label">QUESTION</div>
                                <div class="section-content">${highlightText(item.question, searchTerm)}</div>
                                
                                <div class="answer-label">ANSWER</div>
                                <div class="section-content">${highlightText(item.answer, searchTerm)}</div>
                                
                                ${item.posted_date ? `<div class="posted-date">Posted: ${item.posted_date}</div>` : ''}
                            </div>
                            ` : ''}
                            
                            ${isReference && pdfFiles[item.name] ? `
                            <a href="${pdfFiles[item.name]}" target="_blank" class="pdf-download-button">
                                📥 Download ${item.resource_type}
                            </a>
                            ` : ''}
                            
                            ${item.additional_guidance ? `
                            <div class="result-section">
                                <div class="additional-guidance-toggle" onclick="toggleGuidance(${index})">
                                    <div class="additional-guidance-toggle-text">
                                        <span>📋</span>
                                        <span>Additional Guidance & Reference Tables</span>
                                    </div>
                                    <span class="additional-guidance-icon" id="guidance-icon-${index}">▼</span>
                                </div>
                                <div class="additional-guidance-content" id="guidance-content-${index}">
                                    <div class="additional-guidance-inner">${formatDefinitionText(highlightText(item.additional_guidance, searchTerm))}</div>
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    `;
                });

                container.innerHTML = html;
            }

            container.style.display = 'block';
            searchContainer.classList.add('with-results');
        }

        // Handle search input
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                search(e.target.value);
            }, 300);
        });

        // Handle Enter key
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                clearTimeout(searchTimeout);
                search(e.target.value);
            }
        });

        // Initialize
        console.log(`Loaded ${cathpciData.length} total entries across all coding guidance sources and reference resources`);
    </script>
